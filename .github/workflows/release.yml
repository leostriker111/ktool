name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar PyInstaller
        run: pip install pyinstaller

      - name: Construir ejecutable
        run: pyinstaller --onefile --name kmap ktool_launcher.py

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Construir instalador
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\ktool.iss'

      - name: Publicar en el release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/kmap.exe
            installer/Output/ktool-setup.exe
